# Prometheus configuration for Slurm Heartbeat
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'slurm-heartbeat'
    static_configs:
      - targets: ['slurm-heartbeat:9090']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s

  # Optional: Scrape multiple heartbeat instances
  # - job_name: 'slurm-heartbeat-cluster'
  #   file_sd_configs:
  #     - files:
  #         - 'targets/heartbeat-*.yml'
  #   scrape_interval: 10s
