# Example configuration for Slurm Heartbeat daemon (EFP Readiness Publisher)
# Copy this to /etc/slurm/heartbeat/config.yaml and modify as needed
#
# Per EFP recommendation: This daemon can run in three modes:
# - publisher: Serve /readiness and /metrics endpoints
# - client: Collect Slurm state and send heartbeats to peers
# - both: Combine both modes (default)

general:
  # Logging configuration
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_file: "/var/log/slurm/heartbeat.log"
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Process management
  pid_file: "/var/run/slurm/heartbeat.pid"
  daemonize: false  # Set to true for background operation

# Local cluster identification (required for EFP readiness)
cluster:
  id: "lumi"                    # Unique site identifier (e.g., "lumi", "leonardo")
  name: "lumi-prod"             # Local cluster name
  site: "CSC Finland"           # Site/organization name

# Client configuration - sends heartbeats to federation peers
client:
  enabled: true
  
  # Heartbeat timing
  interval_seconds: 10      # Time between outgoing heartbeats
  timeout_seconds: 30       # Wait time for peer response
  retry_count: 3            # Number of retry attempts
  retry_backoff: 2.0        # Exponential backoff multiplier
  
  # Slurm integration
  slurm:
    api_url: "http://localhost:6820"      # Slurm REST API endpoint
    api_version: "0.0.39"                  # Slurm REST API version
    timeout: 5                             # API request timeout (seconds)
    
    # Alternative: Direct slurmctld socket (requires root)
    # socket_path: "/run/slurm/slurmctld.sock"
  
  # Client TLS configuration for mTLS and message signing
  tls:
    enabled: true
    cert_file: "/etc/slurm/heartbeat/cert.pem"
    key_file: "/etc/slurm/heartbeat/key.pem"
    ca_file: "/etc/slurm/heartbeat/ca.pem"
    # Optional: Separate key file for message signing (if different from TLS key)
    # signing_key_file: "/etc/slurm/heartbeat/signing-key.pem"
    
  # Federation peers to send heartbeats to
  federation:
    enabled: false  # Feature flag - set to true to enable federation features
    peers:
      - name: "leonardo"
        endpoint: "https://leonardo.example.com:8443/readiness"  # Changed to /readiness for EFP
        site: "CINECA Italy"
        timeout_seconds: 30
        
      - name: "mars"
        endpoint: "https://mars.example.com:8443/readiness"
        site: "HLRS Germany"
        timeout_seconds: 30
    
    # Peer public keys for signature verification
    # Format: peer_name -> PEM-encoded public key
    # Leave empty if not using signature verification
    peer_public_keys: {}  # Empty dict, not None
    
    # Aggregation settings
    aggregation_interval_seconds: 60  # How often to aggregate peer metrics
    peer_timeout_seconds: 30  # Timeout for peer requests
    max_history_size: 100  # Maximum history entries for trend analysis

# Server configuration - serves readiness and receives heartbeats
server:
  enabled: true
  
  # Network binding
  listen_address: "0.0.0.0"  # Bind to all interfaces
  listen_port: 8443           # Port to listen on
  
  # Authorization for /readiness endpoint
  # Sites allowed to query readiness (empty = allow all for testing)
  allowed_sites:
    - "lumi"
    - "leonardo"
    - "mars"
    - "efp-monitoring"
  
  # TLS configuration (recommended: enabled)
  tls:
    enabled: true
    cert_file: "/etc/slurm/heartbeat/cert.pem"
    key_file: "/etc/slurm/heartbeat/key.pem"
    ca_file: "/etc/slurm/heartbeat/ca.pem"
    client_auth: "required"   # "required", "optional", or "disabled"
    
    # TLS version (recommended: 1.3)
    min_version: "1.3"
    max_version: "1.3"
  
  # Connection limits
  max_connections: 100
  connection_timeout: 30
  
  # Feature flags (advanced)
  enable_legacy_p2p: false  # Enable legacy P2P heartbeat receiver (default: false)
  
  # Signature verification - public keys for federation peers
  # Format: peer_name -> PEM-encoded public key
  # Leave empty if not using signature verification
  peer_public_keys: {}  # Empty dict, not None
  
  # Message signing - private key for signing outgoing readiness documents
  # If not set, readiness documents will be unsigned
  # signing_key_file: "/etc/slurm/heartbeat/signing-key.pem"

# Note: The following sections are NOT yet implemented and will be ignored:
# - monitoring.alerting (webhook, email notifications)
# - security.certificate (auto-rotation)
# - security.access_control (IP restrictions, rate limiting)
# - performance (connection pooling, resource limits)
# - debug (verbose logging options)
#
# Only the following sections are currently implemented:
# - general (logging, process management)
# - cluster (site identification)
# - client (Slurm integration, federation peers, TLS)
# - server (authorization, TLS, feature flags)
# - monitoring.prometheus (metrics export)
# - client.federation (peer discovery, capacity aggregation, queue prediction)
