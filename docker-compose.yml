version: '3.8'

services:
  slurm-heartbeat:
    build: .
    container_name: slurm-heartbeat
    restart: unless-stopped
    ports:
      - "8443:8443"  # Readiness endpoint (HTTPS)
      - "9090:9090"  # Metrics endpoint (HTTP)
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./certs:/etc/slurm/heartbeat:ro
      - heartbeat-logs:/var/log/slurm-heartbeat
    environment:
      - SLURM_HEARTBEAT_CONFIG=/app/config.yaml
      - SLURM_HEARTBEAT_MODE=publisher
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - heartbeat-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"  # Prometheus UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - heartbeat-network
    depends_on:
      - slurm-heartbeat

volumes:
  heartbeat-logs:
  prometheus-data:

networks:
  heartbeat-network:
    driver: bridge
